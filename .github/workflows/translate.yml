name: Auto Run Translation Tools 🌍🤖

on:
  push:
    branches: [ main, master ] # מורץ אוטומטית בכל push 🚀
  workflow_dispatch: # אפשרות להפעלה ידנית 🖱️

# הרשאה ל-GitHub Action לבצע commit ו-push לריפו 🔑
permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository 📦
        uses: actions/checkout@v4

      - name: Set up Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies 🛠️
        run: |
          python -m pip install --upgrade pip
          pip install deep-translator

      - name: Run translation script 🚀
        run: python tools/translate.py

      - name: Commit and push translated files 📝
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-translated resources to Hebrew 🌍 [skip ci]"
          file_pattern: 'app/src/main/res/values-he/*.xml'
