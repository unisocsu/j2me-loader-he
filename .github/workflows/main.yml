name: Test Translation Connection 🧪

on:
  workflow_dispatch: # הפעלה ידנית בלחיצת כפתור 🖱️

jobs:
  test-translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository 📦
        uses: actions/checkout@v4

      - name: Set up Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deep-translator 🛠️
        run: |
          python -m pip install --upgrade pip
          pip install deep-translator

      - name: Run single word test 🚀
        run: python test_translate.py
