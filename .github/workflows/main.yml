name: Auto Run Translation Tools 🌍🤖

on:
  push:
    branches: [ main, master ] # מורץ אוטומטית בכל push 🚀
  workflow_dispatch: # אפשרות להפעלה ידנית 🖱️

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository 📦
        uses: actions/checkout@v4

      - name: Set up Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies 🛠️
        run: |
          python -m pip install --upgrade pip
          pip install deep-translator

      - name: Run translation script from tools directory 🚀
        run: python tools/translate.py

      - name: Upload translated files 📤
        uses: actions/upload-artifact@v4
        with:
          name: values-he-translated
          path: app/src/main/res/values-he/
